name: Generate trophy card

on:
  schedule: # execute every 12 hours
    - cron: "50 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TROPHY_REPO: Erik-Donath/github-profile-trophy
      TROPHY_SHA: eb0893b31de06841663555d10aa43eb7cf27952f

    steps:
      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # O GITHUB_TOKEN padrão não pode ler `organizations` na API GraphQL,
      # o que faz a consulta devolver `user: null`. Removemos esse campo
      # (o troféu de organizações fica zerado) para funcionar sem PAT.
      # Se existir o secret PROFILE_TOKEN, ele é usado no lugar.
      - name: fetch and patch trophy generator
        run: |
          git init -q trophy && cd trophy
          git fetch -q --depth 1 "https://github.com/$TROPHY_REPO" "$TROPHY_SHA"
          git checkout -q FETCH_HEAD
          perl -0pi -e 's/\s*organizations\(first: 1\) \{\s*totalCount\s*\}//g' src/Schemas/index.ts
          sed -i 's/userActivity\.organizations\.totalCount/(userActivity.organizations?.totalCount ?? 0)/' src/user_info.ts
          ! grep -n 'organizations(first' src/Schemas/index.ts

      - name: generate trophy.svg
        env:
          GITHUB_TOKEN1: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          deno run --allow-net --allow-env --allow-read --allow-write \
            trophy/render_svg.ts "${{ github.repository_owner }}" \
            --file dist/trophy.svg \
            --theme darkhub \
            --rows 1 --cols 6 \
            --margin-width 10 --margin-height 10 \
            --no-frame

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
